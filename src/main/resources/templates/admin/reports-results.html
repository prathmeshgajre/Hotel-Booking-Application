<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout-main}">

<head>
    <title>Search Results</title>
</head>

<body>

<th:block layout:fragment="content">

    <div class="container">

        <div class="row mb-3">
            <div class="col-md-12 d-flex justify-content-between align-items-center">
                <h2>Booking Results</h2>

                <div class="d-flex gap-2">

                    <!-- Download PDF -->
                    <a th:if="${filteredUserId == null}"
                       th:href="@{/admin/reports/bookings/date-range(fromDate=${fromDate},toDate=${toDate})}"
                       class="btn btn-success">
                        ⬇ Download PDF
                    </a>

                    <a th:if="${filteredUserId != null}"
                       th:href="@{/admin/reports/bookings/date-range(fromDate=${fromDate},toDate=${toDate},userId=${filteredUserId})}"
                       class="btn btn-success">
                        ⬇ Download PDF
                    </a>

                    <a th:href="@{/admin/reports/search}" class="btn btn-secondary">
                        New Search
                    </a>

                </div>
            </div>
        </div>

        <!-- Date Range Info -->
        <div class="alert alert-info mb-4">

            Showing bookings from
            <strong th:text="${fromDate}"></strong>
            to
            <strong th:text="${toDate}"></strong>

            <span th:if="${filteredUserId != null}">
            for <strong>User ID: <span th:text="${filteredUserId}"></span></strong>
        </span>

            <span th:if="${filteredUserId == null}">
            for <strong>All Users</strong>
        </span>

        </div>

        <!-- No Results -->
        <div th:if="${uniqueUsers.isEmpty()}" class="alert alert-warning">
            No bookings found for the selected date range.
        </div>

        <!-- Users Table -->
        <div th:if="${!uniqueUsers.isEmpty()}">

            <h4 class="mb-3">Users with Bookings</h4>

            <table class="table table-striped align-middle">

                <thead class="table-dark">
                <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Bookings in Range</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="user : ${uniqueUsers}">

                    <td th:text="${user.id}"></td>

                    <td th:text="${user.name + ' ' + user.lastName}"></td>

                    <td th:text="${user.username}"></td>

                    <td th:text="${user.role.roleType.name()}"></td>

                    <!-- FIXED BOOKING COUNT -->
                    <td>
                        <span th:text="${bookingCountByUser[user.id]}"></span>
                    </td>

                    <td>
                        <a th:href="@{/admin/users/{userId}/bookings(userId=${user.id})}"
                           class="btn btn-primary btn-sm">
                            View History
                        </a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</th:block>

</body>
</html>
